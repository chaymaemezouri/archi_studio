# Nginx système (Ubuntu) — proxy vers Docker docker-compose.yml
# Ports par défaut après sed : frontend 3002, backend 3001
#
# sudo cp deploy/nginx-host-docker.conf /etc/nginx/sites-available/a2workspace.studio
# sudo ln -sf /etc/nginx/sites-available/a2workspace.studio /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name a2workspace.studio www.a2workspace.studio;

    client_max_body_size 50M;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
