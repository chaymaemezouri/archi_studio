# HTTPS — activer après certbot :
#   cp deploy/nginx.ssl.conf deploy/nginx.conf
#   docker compose -f docker-compose.prod.yml restart nginx

upstream frontend {
  server frontend:3000;
}

upstream backend {
  server backend:3001;
}

server {
  listen 80;
  server_name a2workspace.studio www.a2workspace.studio;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name a2workspace.studio www.a2workspace.studio;

  ssl_certificate /etc/letsencrypt/live/a2workspace.studio/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/a2workspace.studio/privkey.pem;

  client_max_body_size 50M;

  location /api/ {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
