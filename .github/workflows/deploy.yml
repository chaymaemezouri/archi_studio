name: Deploy to VPS

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy a2workspace.studio
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VPS_HOST="$(printf '%s' "$VPS_HOST" | tr -d '\r\n' | xargs)"
          VPS_USER="$(printf '%s' "$VPS_USER" | tr -d '\r\n' | xargs)"
          VPS_PATH="$(printf '%s' "$VPS_PATH" | tr -d '\r\n' | xargs)"
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${VPS_USER}@${VPS_HOST}" bash -s <<REMOTE_SCRIPT
          set -euo pipefail
          export GH_TOKEN='${{ secrets.GITHUB_TOKEN }}'
          cd '${VPS_PATH}'
          echo "==> git fetch + reset (pre-deploy)"
          REPO_PATH="\$(git remote get-url origin | sed -E 's#(https://github.com/|git@github.com:)##; s#\\.git\$##')"
          GIT_TERMINAL_PROMPT=0 git -c credential.helper= \
            fetch "https://x-access-token:\${GH_TOKEN}@github.com/\${REPO_PATH}.git" main
          git checkout main 2>/dev/null || git checkout -B main origin/main
          git reset --hard origin/main
          bash deploy/deploy.sh
          REMOTE_SCRIPT
